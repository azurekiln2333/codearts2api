services:
  codearts2api:
    build:
      context: ${CA2A_BUILD_CONTEXT:-.}
      args:
        BUILD_COMMIT: ${CA2A_BUILD_COMMIT:-}
        BUILD_TIME: ${CA2A_BUILD_TIME:-}
    container_name: ${CA2A_CONTAINER_NAME:-codearts2api}
    restart: ${CA2A_RESTART_POLICY:-unless-stopped}
    ports:
      - "${CA2A_PORT:-7866}:${CA2A_PORT:-7866}"
    env_file:
      - .env
    environment:
      CA2A_API_KEY: ${CA2A_API_KEY:?需要设置 CA2A_API_KEY（写 .env 或 export 到环境变量）}
      TZ: ${TZ:-Asia/Shanghai}
      # Keep the published port and the server listener in sync.
      CA2A_LISTEN: ":${CA2A_PORT:-7866}"
    volumes:
      - "${CA2A_AUTHS_PATH:-./auths}:/app/auths"
      - "${CA2A_DATA_PATH:-./data}:/app/data"
      - "${CA2A_CONFIG_PATH:-./config.json}:/app/config.json:ro"
